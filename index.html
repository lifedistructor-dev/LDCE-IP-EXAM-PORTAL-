:root{--bg:#ffffff;--card:#fff;--ink:#0f1b3d;--muted:#64748b;--line:#e2e8f4;--blue:#1e3a8a;--soft:#e8f0ff;--ok:#16a34a;--shadow:0 4px 18px rgba(30,58,138,.10);--fs:16px;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs);line-height:1.5;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:86vh;z-index:-1;pointer-events:none;background:radial-gradient(85% 58% at 6% 6%,#1e4fd6 0%,rgba(30,79,214,0) 74%),radial-gradient(75% 52% at 98% 10%,#4b8df8 0%,rgba(75,141,248,0) 76%),linear-gradient(#bcd6ff 0%,rgba(205,226,255,.65) 42%,rgba(255,255,255,0) 100%)}
.hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;color:#fff;background:rgba(30,64,175,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.logo{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#fff;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:17px;line-height:1.2}
.ht small{display:block;font-size:12px;letter-spacing:.08em;opacity:.78;text-transform:uppercase}
.pbtn{flex:none;width:46px;height:46px;border-radius:14px;border:0;background:#fafafa;color:#0f1b3d;box-shadow:0 2px 10px rgba(0,0,0,.1);font-size:20px;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 0}
.prof{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:18px}
.pt{display:flex;gap:16px;align-items:flex-start}
.av{position:relative;flex:none;width:86px;height:86px;border-radius:50%;border:3px solid var(--blue);padding:3px;background:#fff}
.av .im{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#1e3a8a,#3b82f6) center/cover;color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px}
.av i{position:absolute;right:2px;bottom:4px;width:16px;height:16px;border-radius:50%;background:#10b981;border:3px solid #fff}
.pi{flex:1;min-width:0}
.pi h2{margin:2px 0 8px;font-size:18px;line-height:1.2;font-weight:800;text-transform:uppercase;overflow-wrap:anywhere}
.pi p{margin:3px 0;font-size:14px;font-weight:600;text-transform:uppercase;color:#1f2d55}
.clk{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;border-radius:999px;background:var(--soft);border:1px solid #cfe0ff;color:var(--blue);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.clk:before{content:"";width:9px;height:9px;border-radius:50%;background:#10b981}
.ctl{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:16px 0 6px;padding-top:16px;border-top:1px solid var(--line)}
.seg{display:flex;border-radius:999px;background:var(--soft);border:1px solid #cfe0ff;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--blue);font-weight:800;padding:10px 16px;cursor:pointer}
.syl,.off{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;text-decoration:none;cursor:pointer}
.syl{color:#fff;background:linear-gradient(135deg,#f59e0b,#c2410c);box-shadow:0 6px 14px rgba(194,65,12,.35)}
.off{color:var(--blue);background:var(--soft);border:1px solid #cfe0ff}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:700}
.pg b{color:var(--blue)}
.bar{height:11px;border-radius:99px;background:#dde5f2;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#1e3a8a,#3b82f6);transition:width .5s}
.search{display:flex;align-items:center;gap:10px;margin:18px 0 6px;padding:0 18px;height:56px;border-radius:999px;background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px}
.st{display:flex;align-items:center;gap:8px;margin:20px 4px 10px;font-size:20px;font-weight:800}
.st small{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.rc{flex:none;width:230px;background:#fff;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);font-weight:700;font-size:14px;text-transform:uppercase;line-height:1.35}
.rc small{display:block;margin-top:8px;font-weight:500;color:var(--muted);text-transform:none;font-size:13px}
.exh{display:flex;align-items:center;gap:14px;width:100%;margin-top:22px;padding:6px 6px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;font-size:18px;line-height:1.35}
.eic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#e3e9f4}
.etx{flex:1}
.etx b{font-weight:800}
.chev{flex:none;width:10px;height:10px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin:0 6px}
.exh .chev{color:var(--blue)}
.exh[aria-expanded="true"] .chev,.pc[open] summary .chev{transform:rotate(45deg)}
.pc{margin-top:14px;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--g2) 30%,transparent)}
.pc summary{list-style:none;display:flex;align-items:center;gap:14px;padding:18px 16px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2))}
.pc summary::-webkit-details-marker{display:none}
.pic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.22)}
.ptx{flex:1;min-width:0;font-size:18px;line-height:1.35}
.ptx b{font-weight:800}
.ptx em{font-style:normal;opacity:.95}
.pcn{flex:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.24);border-radius:99px;padding:3px 10px}
.pb{padding:4px 14px 10px}
.ssh{display:flex;justify-content:space-between;margin:12px 0 2px;font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #c3cde0;background:#fff;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;padding:0}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .t{color:var(--muted)}
.t{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.pdf{flex:none;border:1.5px solid var(--blue);color:var(--blue);background:transparent;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;cursor:pointer}
.star{flex:none;border:0;background:none;font-size:22px;cursor:pointer;color:#cbd5e1;padding:2px 6px}
.star.on{color:#f59e0b}
.rcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:2px 14px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.mark{background:#fde68a;border-radius:3px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(30,58,138,.08)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;padding:8px 14px;border:0;border-radius:18px;background:transparent;color:#7b88a3;font-size:12.5px;font-weight:600;cursor:pointer}
.nav button[aria-current="page"]{background:var(--soft);color:var(--blue)}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:24px;padding:20px;width:min(92vw,420px);box-shadow:0 20px 60px rgba(0,0,0,.35);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,50,.55)}
dialog h3{margin:0 0 12px}
dialog label{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
dialog input[type=text]{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
dialog input[type=file]{width:100%}
.dact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.dact button{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--blue)}
.dact button.pri{background:var(--blue);color:#fff}
#vw{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:#172554}
#vw[hidden]{display:none}
.vb{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(135deg,#1e3a8a,#172554);color:#fff}
.vb button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;height:38px;min-width:42px;padding:0 12px;font-weight:700;cursor:pointer}
#vt{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vf{flex:1;width:100%;border:0;background:#fff}
@media (prefers-reduced-motion:reduce){.bar i,.chev{transition:none}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byFile(f){for(var i=0;i<D.length;i++)if(D[i][3]===f)return D[i]}

function rowHTML(x,q,sub){
  var f=x[3],t=esc(x[2]);
  if(q){var i=x[2].toLowerCase().indexOf(q);if(i>=0)t=esc(x[2].slice(0,i))+'<span class="mark">'+esc(x[2].slice(i,i+q.length))+'</span>'+esc(x[2].slice(i+q.length))}
  return '<div class="row'+(S.done[f]?' done':'')+'"><button class="chk" data-d="'+f+'" aria-label="Mark studied" aria-pressed="'+!!S.done[f]+'">'+(S.done[f]?'✓':'')+'</button>'
  +'<a class="t" href="'+BASE+f+'">'+t+(sub?'<small>'+EX[x[0]]+' · '+esc(x[1])+'</small>':'')+'</a>'
  +'<button class="pdf" data-p="'+f+'" aria-label="Download PDF">PDF</button>'
  +'<button class="star'+(S.fav[f]?' on':'')+'" data-f="'+f+'" aria-label="Bookmark">'+(S.fav[f]?'★':'☆')+'</button></div>';
}
function paperHTML(g){
  var all=D.filter(function(x){return x[0]===g.ex&&g.secs.indexOf(x[1])>=0}),dn=all.filter(function(x){return S.done[x[3]]}).length;
  var h='<details class="pc" data-o="'+g.id+'"'+(S.open[g.id]?' open':'')+' style="--g1:'+g.g[0]+';--g2:'+g.g[1]+'"><summary><span class="pic">'+g.ic+'</span><span class="ptx"><b>'+g.t+'</b> <em>('+g.s+')</em></span><span class="pcn">'+dn+'/'+all.length+'</span><span class="chev"></span></summary><div class="pb">';
  g.secs.forEach(function(sn){
    var rs=all.filter(function(x){return x[1]===sn});if(!rs.length)return;
    if(g.secs.length>1)h+='<div class="ssh"><span>'+esc(sn)+'</span><span>'+rs.filter(function(x){return S.done[x[3]]}).length+'/'+rs.length+'</span></div>';
    rs.forEach(function(x){h+=rowHTML(x)});
  });
  return h+'</div></details>';
}
function render(){
  var q=$("q").value.trim().toLowerCase(),h="";
  if(q){
    var rs=D.filter(function(x){return (x[2]+" "+x[1]).toLowerCase().indexOf(q)>=0});
    h=rs.length?'<div class="st">🔍 Search results<small>'+rs.length+' topics</small></div><div class="rcard">'+rs.map(function(x){return rowHTML(x,q,1)}).join("")+'</div>':'<div class="empty">કોઈ પરિણામ મળ્યું નથી. બીજો શબ્દ શોધો.</div>';
  }else if(S.view==="saved"){
    var fv=D.filter(function(x){return S.fav[x[3]]});
    h=fv.length?'<div class="st">⭐ Saved<small>'+fv.length+' topics</small></div><div class="rcard">'+fv.map(function(x){return rowHTML(x,"",1)}).join("")+'</div>':'<div class="empty">હજી કોઈ ટોપિક સેવ કર્યો નથી. ટોપિક આગળના ☆ પર ટેપ કરો.</div>';
  }else{
    var rc=(S.recent||[]).filter(byFile);
    if(rc.length)h+='<div class="st">🕘 Recently Opened</div><div class="rail">'+rc.map(function(f){var x=byFile(f);return '<a class="rc" href="'+BASE+f+'">'+esc(x[2])+'<small>🕘 '+EX[x[0]]+' · '+esc(x[1])+'</small></a>'}).join("")+'</div>';
    ["IP","AAO"].forEach(function(ex){
      var open=!S.exc[ex];
      h+='<button class="exh" data-e="'+ex+'" aria-expanded="'+open+'"><span class="eic">'+EXH[ex][2]+'</span><span class="etx"><b>'+EXH[ex][0]+'</b> '+EXH[ex][1]+'</span><span class="chev"></span></button>';
      if(open)GR.forEach(function(g){if(g.ex===ex)h+=paperHTML(g)});
    });
  }
  $("main").innerHTML=h;
  var n=D.length,d=D.filter(function(x){return S.done[x[3]]}).length;
  $("pcnt").textContent=d+"/"+n;$("pbar").style.width=(n?d/n*100:0)+"%";

}

  var a=e.target.closest("a.t,a.rc");

var vOpen=false,vPrint=false,vCur="";
function T(f){var x=byFile(f);return x?x[2]:f}
function openV(f,auto){
  $("vt").textContent=T(f);vCur=f;$("vw").hidden=false;document.body.style.overflow="hidden";
  S.recent=[f].concat((S.recent||[]).filter(function(x){return x!==f})).slice(0,6);save();
  vPrint=!!auto;$("vf").src=BASE+f;
  if(!vOpen){history.pushState({v:1},"");vOpen=true}
}
function closeV(){$("vw").hidden=true;$("vf").src="about:blank";document.body.style.overflow="";vOpen=false;render()}
window.addEventListener("popstate",function(){if(vOpen)closeV()});
$("vback").onclick=function(){if(vOpen)history.back()};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&vOpen)history.back()});
function printV(){
  var f=$("vf"),old=document.title;
  try{
    var d=f.contentDocument;
    d.querySelectorAll("details").forEach(function(x){x.open=true});
    if(!d.getElementById("pdfx")){var st=d.createElement("style");st.id="pdfx";st.textContent="@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}";d.head.appendChild(st)}
    document.title=$("vt").textContent;
    f.contentWindow.focus();f.contentWindow.print();
    setTimeout(function(){document.title=old},2000);
  }catch(e){window.open(f.src,"_blank")}
}
function pdfOpen(f){
  var w=null;
  try{w=window.open(BASE+f+"#pdf","_blank")}catch(e){}
  if(!w){if(vOpen&&vCur===f)printV();else openV(f,true)}
}
$("vpdf").onclick=function(){pdfOpen(vCur)};
$("vf").addEventListener("load",function(){
  if(vPrint&&this.src.indexOf("about:blank")<0){vPrint=false;setTimeout(printV,700)}
});

  var b=this,c=await caches.open("ldce-pages"),fail=0,done=0;b.disabled=true;
  var L=D.map(function(x){return x[3]}).concat(["syllabus.html"]);
  for(var i=0;i<L.length;i+=8){
    await Promise.all(L.slice(i,i+8).map(async function(f){
      try{var r=await fetch(BASE+f);if(r.ok)await c.put(BASE+f,r);else fail++}catch(e){fail++}
      done++;b.textContent=Math.round(done/L.length*100)+"%";
    }));
  }
  b.disabled=false;b.textContent="⬇ Offline";
  alert(fail?("સેવ થયું, પણ "+fail+" પેજ સેવ ન થયા. ઇન્ટરનેટ ચાલુ રાખી ફરી પ્રયાસ કરો."):"બધા ટોપિક ઓફલાઇન માટે સેવ થઈ ગયા.");
};
load();applyFs();paintProf();tick();setInterval(tick,1000);render();
</script>
